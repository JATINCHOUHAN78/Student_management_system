name: Python application checks

on:
  push:
    branches: ["main", "feature/teacher-attendance-postgres"]
  pull_request:
    branches: ["main"]

jobs:
  compile-and-dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application and migration utility
        run: python -m py_compile app.py migrate_students_csv.py
